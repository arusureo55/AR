<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>わたしのARシーン</title>
<style>
  html, body{width:100%;height:100%;margin:0;padding:0;
    font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;background:#14161A}
  #lock{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
    color:#E4E5DF;padding:24px;box-sizing:border-box}
  #lock .card{width:100%;max-width:340px;text-align:center}
  #lock h1{font-size:19px;margin:0 0 6px;letter-spacing:.02em}
  #lock p{font-size:13px;line-height:1.7;color:#9AA3AE;margin:0 0 18px}
  #lock .mark{width:38px;height:38px;border:3px solid #E4E5DF;margin:0 auto 16px;position:relative}
  #lock .mark::after{content:"";position:absolute;inset:5px 5px auto auto;width:10px;height:10px;background:#E8451F}
  #lock input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #3A414D;border-radius:3px;
    background:#1E222A;color:#fff;font-size:16px;text-align:center;margin-bottom:10px}
  #lock button{width:100%;padding:13px;border:0;border-radius:3px;background:#E8451F;
    color:#fff;font-size:15px;font-weight:700}
  #lock button:disabled{opacity:.5}
  #lock .msg{min-height:20px;margin-top:12px;font-size:12.5px;color:#E8451F}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
  .shake{animation:shake .4s}
</style>
</head>
<body>
<iframe id="frame" allow="camera; microphone; gyroscope; accelerometer; magnetometer; xr-spatial-tracking; fullscreen"></iframe>
<div id="lock"><div class="card">
  <div class="mark"></div>
  <h1>わたしのARシーン</h1>
  <p>合言葉を入れると見られます</p>
  <input type="password" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="合言葉">
  <button id="go">ひらく</button>
  <div class="msg" id="msg"></div>
</div></div>

  }catch(e){
    try{
      var f = document.getElementById("frame");
      f.style.display = "block";
      f.srcdoc = html;
      var lock = document.getElementById("lock");
      if(lock && lock.parentNode) lock.parentNode.removeChild(lock);
    }catch(e2){ msg("ひらけませんでした。ページを読み込み直してください"); }
  }
}
function unlock(){
  var pw = document.getElementById("pw").value;
  if(!pw){ msg("合言葉を入れてください"); return; }
  if(!(window.crypto && crypto.subtle)){ msg("このブラウザでは開けません"); return; }
  var btn = document.getElementById("go");
  btn.disabled = true; msg("たしかめています…");
  var enc = new TextEncoder();
  crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
  .then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:toBuf(LOCK.s), iterations:LOCK.n, hash:"SHA-256"},
      k, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  })
  .then(function(aes){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:toBuf(LOCK.i)}, aes, toBuf(LOCK.d));
  })
  .then(function(buf){ reveal(new TextDecoder().decode(buf)); })
  .catch(function(){
    btn.disabled = false;
    msg("合言葉がちがいます");
    var card = document.querySelector("#lock .card");
    if(card){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
  });
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key === "Enter") unlock(); });
</script>
