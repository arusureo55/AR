<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>わたしのARシーン</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
  body{margin:0;padding:0;overflow:hidden;
    font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;
    background:rgba(20,22,26,.78);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px}
  #filenote{display:none;position:fixed;left:12px;right:12px;top:12px;z-index:120;
    background:#14161A;color:#E4E5DF;border-left:4px solid #E8451F;padding:14px 16px;
    border-radius:4px;font-size:12.5px;line-height:1.7}
  #filenote b{display:block;font-size:13.5px;margin-bottom:4px}
  #filenote button{margin-top:10px;background:none;border:1px solid #4A5260;color:#E4E5DF;
    padding:6px 12px;border-radius:3px;font-size:12px}
  #camnote{display:none;position:fixed;left:12px;right:12px;bottom:70px;z-index:130;
    background:#14161A;color:#E4E5DF;border-left:4px solid #E8451F;padding:14px 16px;
    border-radius:4px;font-size:12.5px;line-height:1.7}
  #camnote b{display:block;font-size:13.5px;margin-bottom:4px}
  #camnote button{margin-top:10px;background:none;border:1px solid #4A5260;color:#E4E5DF;
    padding:6px 12px;border-radius:3px;font-size:12px}
  #sound{display:none;position:fixed;right:12px;top:12px;z-index:110;border:0;
    background:rgba(20,22,26,.82);color:#fff;padding:10px 14px;border-radius:999px;
    font-size:13px;font-weight:700}
</style>
</head>
<body>
<div id="hint">マーカーにカメラを向けてください</div>
<a-scene embedded vr-mode-ui="enabled: false"
  renderer="colorManagement: true; antialias: true"
  arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; canvasWidth: 800; canvasHeight: 600; maxDetectionRate: 60;">
    <a-marker preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.02" smoothThreshold="2">
      <a-entity light="type: hemisphere; color: #ffffff; groundColor: #2a2f3a; intensity: 0.95"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 0.75; castShadow: false" position="3 6 4"></a-entity>
      <a-entity light="type: directional; color: #8fb4ff; intensity: 0.25; castShadow: false" position="-4 2 -3"></a-entity>
      <a-sphere radius="0.5" position="0.00 0.50 0.00" rotation="0 0 0" scale="0.50 0.50 0.50" material="color: #3FA34D; roughness: 0.52; metalness: 0.06; opacity: 1; transparent: false; side: double" animation="property: object3D.position.y; from: 0.50; to: 0.75; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine"></a-sphere>
    </a-marker>
    <a-entity camera></a-entity>
</a-scene>
<div id="camnote">
  <b id="camtitle">カメラが始まりません</b>
  <span id="camwhy"></span>
  <button id="camx">とじる</button>
</div>
<script>
  var arNoteShown = false, markerSeen = false;
  function arNote(title, why){
    if(arNoteShown) return;
    arNoteShown = true;
    document.getElementById("camtitle").textContent = title;
    document.getElementById("camwhy").textContent = why;
    document.getElementById("camnote").style.display = "block";
  }
  function camReason(){
    if(location.protocol === "file:") return "ファイルから直接ひらいています。https のページか localhost で開いてください。";
    if(location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1"){
      return "https のページではありません。カメラは https か localhost でしか使えません。";
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return "このブラウザはカメラに対応していません。SafariかChromeでお試しください。";
    }
    return "カメラの利用が許可されていないか、他のアプリが使っている可能性があります。ページを再読み込みして「許可」を選んでください。";
  }
  /* AR.js works out the video size when it first has one, but on
     phones the metadata often arrives late and the layout is left
     at a stale size. Nudging a resize once the feed is really
     running makes it lay the video and canvas out together. */
  function nudge(){ try{ window.dispatchEvent(new Event("resize")); }catch(e){} }
  function watchCamera(){
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      var v = document.getElementById("arjs-video");
      if(v && v.videoWidth > 0){
        clearInterval(timer);
        nudge();
        setTimeout(nudge, 400);
        setTimeout(nudge, 1200);
        return;
      }
      if(tries >= 16){ clearInterval(timer); arNote("カメラが始まりません", camReason()); }
    }, 500);
  }
  window.addEventListener("orientationchange", function(){ setTimeout(nudge, 350); setTimeout(nudge, 900); });
  function watchScene(){
    var sc = document.querySelector("a-scene");
    if(!sc){ setTimeout(watchScene, 400); return; }
    var t0 = Date.now();
    var timer = setInterval(function(){
      if(sc.hasLoaded){ clearInterval(timer); watchMarker(sc); return; }
      if(Date.now() - t0 > 14000){
        clearInterval(timer);
        arNote("中身の読み込みが終わりません", "動画や画像が重いか、通信が届いていません。動画を「軽くする」で小さくするか、通信を確認してください。");
      }
    }, 400);
  }
  /* One blurred frame, a passing shadow or a steep angle is enough
     for the tracker to drop the marker for a moment. Hiding the
     content the instant that happens is what makes it look like it
     "does not show at some angles". Keep the last good pose on
     screen for a short grace period instead. */
  var HOLD_MS = 1400, lostAt = 0, everFound = false, holding = false;
  function holdMarker(m){
    m.addEventListener("markerFound", function(){ everFound = true; lostAt = 0; });
    m.addEventListener("markerLost", function(){ lostAt = Date.now(); });
    if(holding) return;
    holding = true;
    (function loop(){
      requestAnimationFrame(loop);
      if(!everFound || !lostAt) return;
      if(Date.now() - lostAt < HOLD_MS){
        if(m.object3D && !m.object3D.visible) m.object3D.visible = true;
      }
    })();
  }
  function watchMarker(sc){
    var m = sc.querySelector("a-marker");
    if(!m) return;
    holdMarker(m);
    m.addEventListener("markerFound", function(){
      markerSeen = true;
      document.getElementById("camnote").style.display = "none";
    });
    setTimeout(function(){
      if(markerSeen) return;
      arNote("マーカーが見つかりません",
        "カメラは動いています。黒いふちまで画面に入れ、まっすぐ、明るいところで写してください。紙が反射しているとき、印刷が小さすぎるとき、別のマーカーを写しているときは読み取れません。");
    }, 11000);
  }
  /* ARToolkit compares each frame against one fixed brightness cut
     by default. Looking straight down, the phone shades the paper and
     the whole marker lands on one side of that cut, so nothing is
     found. Switching to a per-frame automatic threshold makes it
     adapt to the light it is actually given. */
  function tuneTracking(tries){
    tries = tries || 0;
    try{
      var sc = document.querySelector("a-scene");
      var sys = sc && sc.systems && sc.systems.arjs;
      var ses = sys && (sys._arSession || sys.arSession);
      var ctx = ses && (ses.arContext || ses._arContext);
      var ctl = ctx && ctx.arController;
      if(ctl && ctl.setThresholdMode){
        ctl.setThresholdMode(1);
        if(ctl.setPatternDetectionMode && window.artoolkit && artoolkit.AR_TEMPLATE_MATCHING_COLOR !== undefined){
          ctl.setPatternDetectionMode(artoolkit.AR_TEMPLATE_MATCHING_MONO);
        }
        return;
      }
    }catch(e){}
    if(tries < 20) setTimeout(function(){ tuneTracking(tries + 1); }, 500);
  }
  /* a shader or library failure used to leave a silent black page */
  window.addEventListener("error", function(e){
    var m = (e && e.message) ? String(e.message) : "";
    if(!m) return;
    arNote("表示できませんでした", m.slice(0, 160));
  });
  function startWatch(){ watchCamera(); watchScene(); tuneTracking(0); }
  document.getElementById("camx").addEventListener("click", function(){
    document.getElementById("camnote").style.display = "none";
  });
  if(document.readyState === "complete"){ setTimeout(startWatch, 700); }
  else{ window.addEventListener("load", function(){ setTimeout(startWatch, 700); }); }
</script>
<div id="filenote">
  <b>ファイルから直接ひらいています</b>
  パソコンのChromeならこのまま動きますが、スマホではカメラが使えません。
  同じフォルダの「端末で見る方法.txt」をご覧ください。
  <button id="filenoteX">とじる</button>
</div>
<script>
  if(location.protocol === "file:"){
    var fn = document.getElementById("filenote");
    fn.style.display = "block";
    document.getElementById("filenoteX").addEventListener("click", function(){ fn.style.display = "none"; });
  }
</script>
</body>
</html>
