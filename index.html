<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>わたしのARシーン</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body{margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;
    background:rgba(20,22,26,.78);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px}
  #filenote{display:none;position:fixed;left:12px;right:12px;top:12px;z-index:120;
    background:#14161A;color:#E4E5DF;border-left:4px solid #E8451F;padding:14px 16px;
    border-radius:4px;font-size:12.5px;line-height:1.7}
  #filenote b{display:block;font-size:13.5px;margin-bottom:4px}
  #filenote button{margin-top:10px;background:none;border:1px solid #4A5260;color:#E4E5DF;
    padding:6px 12px;border-radius:3px;font-size:12px}
  #sound{display:none;position:fixed;right:12px;top:12px;z-index:110;border:0;
    background:rgba(20,22,26,.82);color:#fff;padding:10px 14px;border-radius:999px;
    font-size:13px;font-weight:700}
  #lock{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
    background:#14161A;color:#E4E5DF;padding:24px}
  #lock .card{width:100%;max-width:340px;text-align:center}
  #lock h1{font-size:19px;margin:0 0 6px;letter-spacing:.02em}
  #lock p{font-size:13px;line-height:1.7;color:#9AA3AE;margin:0 0 18px}
  #lock .mark{width:38px;height:38px;border:3px solid #E4E5DF;margin:0 auto 16px;position:relative}
  #lock .mark::after{content:"";position:absolute;inset:5px 5px auto auto;width:10px;height:10px;background:#E8451F}
  #lock input{width:100%;padding:13px;border:1px solid #3A414D;border-radius:3px;
    background:#1E222A;color:#fff;font-size:16px;text-align:center;margin-bottom:10px}
  #lock button{width:100%;padding:13px;border:0;border-radius:3px;background:#E8451F;
    color:#fff;font-size:15px;font-weight:700}
  #lock button:disabled{opacity:.5}
  #lock .msg{min-height:20px;margin-top:12px;font-size:12.5px;color:#E8451F}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
  .shake{animation:shake .4s}
</style>
</head>
<body>
<div id="lock"><div class="card">
  <div class="mark"></div>
  <h1>わたしのARシーン</h1>
  <p>合言葉を入れると見られます</p>
  <input type="password" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="合言葉">
  <button id="go">ひらく</button>
  <div class="msg" id="msg"></div>
</div></div>

var SCRIPTS = ["https://aframe.io/releases/1.5.0/aframe.min.js","https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"];
function toBuf(b){var s=atob(b),u=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
var WANT_SOUND = false, soundOn = false;
function vids(){ return document.querySelectorAll("video"); }
function playAll(){
  var vs = vids();
  for(var i=0;i<vs.length;i++){ (function(v){
    v.volume = parseFloat(v.dataset.vol || 1);
    var p = v.play();
    if(p && p.catch) p.catch(function(){ v.muted = true; var q = v.play(); if(q && q.catch) q.catch(function(){}); });
  })(vs[i]); }
}
function applySound(on){
  var vs = vids();
  for(var i=0;i<vs.length;i++){
    vs[i].muted = !on || vs[i].dataset.sound !== "1";
    vs[i].volume = parseFloat(vs[i].dataset.vol || 1);
    var p = vs[i].play(); if(p && p.catch) p.catch(function(){});
  }
  soundOn = on;
  var b = document.getElementById("sound");
  if(b) b.textContent = on ? "🔊 音あり" : "🔇 タップで音を出す";
}
function firstTouch(){ if(WANT_SOUND && !soundOn){ applySound(true); } else { playAll(); } }
function loadNext(list, i, done){
  if(i >= list.length){ done(); return; }
  var s = document.createElement("script");
  s.src = list[i];
  s.onload = function(){ loadNext(list, i+1, done); };
  s.onerror = function(){ msg("読み込みに失敗しました。通信を確認してください"); };
  document.head.appendChild(s);
}
function msg(t){ document.getElementById("msg").textContent = t; }
function reveal(html){
  var lock = document.getElementById("lock");
  if(lock && lock.parentNode) lock.parentNode.removeChild(lock);
  var tpl = document.createElement("template");
  tpl.innerHTML = html;
  document.body.appendChild(tpl.content);
  loadNext(SCRIPTS, 0, function(){
    playAll();
    if(WANT_SOUND){
      var sb = document.getElementById("sound");
      if(sb){ sb.style.display = "block";
        sb.addEventListener("click", function(e){ e.stopPropagation(); applySound(!soundOn); }); }
      applySound(true);
    }
    document.addEventListener("click", firstTouch);
    document.addEventListener("touchend", firstTouch);
  });
}
function unlock(){
  var pw = document.getElementById("pw").value;
  if(!pw){ msg("合言葉を入れてください"); return; }
  if(!(window.crypto && crypto.subtle)){ msg("このブラウザでは開けません"); return; }
  var btn = document.getElementById("go");
  btn.disabled = true; msg("たしかめています…");
  var enc = new TextEncoder();
  crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
  .then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:toBuf(LOCK.s), iterations:LOCK.n, hash:"SHA-256"},
      k, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  })
  .then(function(aes){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:toBuf(LOCK.i)}, aes, toBuf(LOCK.d));
  })
  .then(function(buf){ reveal(new TextDecoder().decode(buf)); })
  .catch(function(){
    btn.disabled = false;
    msg("合言葉がちがいます");
    var card = document.querySelector("#lock .card");
    if(card){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
  });
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", function(e){ if(e.key === "Enter") unlock(); });
</script>
