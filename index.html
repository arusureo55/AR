    arNoteShown = true;
    document.getElementById("camtitle").textContent = title;
    document.getElementById("camwhy").textContent = why;
    document.getElementById("camnote").style.display = "block";
  }
  function camReason(){
    if(location.protocol === "file:") return "ファイルから直接ひらいています。https のページか localhost で開いてください。";
    if(location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1"){
      return "https のページではありません。カメラは https か localhost でしか使えません。";
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return "このブラウザはカメラに対応していません。SafariかChromeでお試しください。";
    }
    return "カメラの利用が許可されていないか、他のアプリが使っている可能性があります。ページを再読み込みして「許可」を選んでください。";
  }
  /* AR.js works out the video size when it first has one, but on
     phones the metadata often arrives late and the layout is left
     at a stale size. Nudging a resize once the feed is really
     running makes it lay the video and canvas out together. */
  function nudge(){ try{ window.dispatchEvent(new Event("resize")); }catch(e){} }
  function watchCamera(){
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      var v = document.getElementById("arjs-video");
      if(v && v.videoWidth > 0){
        clearInterval(timer);
        nudge();
        setTimeout(nudge, 400);
        setTimeout(nudge, 1200);
        return;
      }
      if(tries >= 16){ clearInterval(timer); arNote("カメラが始まりません", camReason()); }
    }, 500);
  }
  window.addEventListener("orientationchange", function(){ setTimeout(nudge, 350); setTimeout(nudge, 900); });
  function watchScene(){
    var sc = document.querySelector("a-scene");
    if(!sc){ setTimeout(watchScene, 400); return; }
    var t0 = Date.now();
    var timer = setInterval(function(){
      if(sc.hasLoaded){ clearInterval(timer); watchMarker(sc); return; }
      if(Date.now() - t0 > 14000){
        clearInterval(timer);
        arNote("中身の読み込みが終わりません", "動画や画像が重いか、通信が届いていません。動画を「軽くする」で小さくするか、通信を確認してください。");
      }
    }, 400);
  }
  function watchMarker(sc){
    var m = sc.querySelector("a-marker");
    if(!m) return;
    m.addEventListener("markerFound", function(){
      markerSeen = true;
      document.getElementById("camnote").style.display = "none";
    });
    setTimeout(function(){
      if(markerSeen) return;
      arNote("マーカーが見つかりません",
        "カメラは動いています。黒いふちまで画面に入れ、まっすぐ、明るいところで写してください。紙が反射しているとき、印刷が小さすぎるとき、別のマーカーを写しているときは読み取れません。");
    }, 11000);
  }
  function startWatch(){ watchCamera(); watchScene(); }
  document.getElementById("camx").addEventListener("click", function(){
    document.getElementById("camnote").style.display = "none";
  });
  if(document.readyState === "complete"){ setTimeout(startWatch, 700); }
  else{ window.addEventListener("load", function(){ setTimeout(startWatch, 700); }); }
</script>
<div id="filenote">
  <b>ファイルから直接ひらいています</b>
  パソコンのChromeならこのまま動きますが、スマホではカメラが使えません。
  同じフォルダの「端末で見る方法.txt」をご覧ください。
  <button id="filenoteX">とじる</button>
</div>
<script>
  if(location.protocol === "file:"){
    var fn = document.getElementById("filenote");
    fn.style.display = "block";
    document.getElementById("filenoteX").addEventListener("click", function(){ fn.style.display = "none"; });
  }
</script>
<script>
  // 一度ひらけば、次からは通信がなくても動きます
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
